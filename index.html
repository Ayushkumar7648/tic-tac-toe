<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="game__header">
      <h1>Tic-Tac-Toe</h1>
      <div class="mode" role="group" aria-label="Game mode">
        <button class="mode__btn is-active" data-mode="pvp" type="button">2 Players</button>
        <button class="mode__btn" data-mode="cpu" type="button">vs Computer</button>
      </div>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="score score--x">
        <span class="score__name">X</span>
        <span class="score__value" id="scoreX">0</span>
      </div>
      <div class="score score--draw">
        <span class="score__name">Draws</span>
        <span class="score__value" id="scoreDraw">0</span>
      </div>
      <div class="score score--o">
        <span class="score__name">O</span>
        <span class="score__value" id="scoreO">0</span>
      </div>
    </section>

    <p class="status" id="status" aria-live="polite">X's turn</p>

    <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
      <button class="cell" data-index="0" role="gridcell" aria-label="Cell 1" type="button"></button>
      <button class="cell" data-index="1" role="gridcell" aria-label="Cell 2" type="button"></button>
      <button class="cell" data-index="2" role="gridcell" aria-label="Cell 3" type="button"></button>
      <button class="cell" data-index="3" role="gridcell" aria-label="Cell 4" type="button"></button>
      <button class="cell" data-index="4" role="gridcell" aria-label="Cell 5" type="button"></button>
      <button class="cell" data-index="5" role="gridcell" aria-label="Cell 6" type="button"></button>
      <button class="cell" data-index="6" role="gridcell" aria-label="Cell 7" type="button"></button>
      <button class="cell" data-index="7" role="gridcell" aria-label="Cell 8" type="button"></button>
      <button class="cell" data-index="8" role="gridcell" aria-label="Cell 9" type="button"></button>
    </div>

    <div class="actions">
      <button class="action action--primary" id="newRound" type="button">New Round</button>
      <button class="action" id="resetScore" type="button">Reset Score</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
